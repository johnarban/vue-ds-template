  <script>
    // Logic derived from https://stackoverflow.com/a/61839170
    const local = (function (hostname=window.location.hostname) {
      return (
        (['localhost', '127.0.0.1', '', '::1'].includes(hostname))
        || (hostname.startsWith('192.168.'))
        || (hostname.startsWith('10.'))
      )
    })();
    if (!local) {
      const script = document.createElement("script");
      script.async = true;
      script.src = "https://www.googletagmanager.com/gtag/js?id=G-C2ELSYY9VC";
      document.head.appendChild(script);
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
  
      gtag('config', 'G-C2ELSYY9VC');
    }
  </script>
  
  <script>
    // webgl detection block
    function isWebGL2Enabled() {
      // It doesn't seem like there's a better way to do this than just to try and get a context
      // https://developer.mozilla.org/en-US/docs/Web/API/WebGL_API/By_example/Detect_WebGL
      // NB: The engine specifically wants a webgl2 context
      const canvas = document.createElement("canvas");
      const gl = canvas.getContext("webgl2");
      return gl instanceof WebGL2RenderingContext;
    }

    // read by WebGlTest.vue; nothing is blocked from loading here
    window.showWebGL2Warning = !isWebGL2Enabled();
  </script>

  <!-- Declared here once for the whole app rather than in MainComponent's stylesheet, since
       component stylesheets are unscoped and this avoids re-declaring it if that content ever
       splits across files. Served as woff2 - 17kB, against 55kB as TrueType - with the .ttf
       original kept as a fallback src. Not preloaded: fetching it up front only pushes the app
       bundle back, and `font-display: swap` keeps text readable in a fallback face until it lands. -->
  <style>@font-face{font-family:Highway Gothic Narrow;src:url(./fonts/HighwayGothicNarrow.woff2)format("woff2"),url(./fonts/HighwayGothicNarrow.ttf)format("truetype");font-display:swap}</style>
