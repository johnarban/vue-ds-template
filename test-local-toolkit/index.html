  <!-- Google Analytics -->
  <script>
    // Logic derived from https://stackoverflow.com/a/61839170
    const local = (function (hostname=window.location.hostname) {
      return (
        (['localhost', '127.0.0.1', '', '::1'].includes(hostname))
        || (hostname.startsWith('192.168.'))
        || (hostname.startsWith('10.'))
      )
    })();
    // make this portable (vite probably has another way to do this)
    window.runningOnLocalhost = local;
    window.gtagMeasurementId = 'G-C2ELSYY9VC';
    // country codes for GDPR consent handling.
    window.euCountryList = [
      'AT', 'BE', 'CY', 'CZ', 'DK', 'EE', 'FI', 'FR',
      'DE', 'GR', 'HU', 'IE', 'IT', 'LV', 'LT', 'LU',
      'MT', 'NL', 'PT', 'SK', 'SI', 'ES', 'SE', 'GB',
      'IS', 'LI', 'NO', 'BG', 'PL', 'RO'
    ];
  </script>
  <script>
    
    if (!local) {
      
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      // https://developers.google.com/tag-platform/security/guides/consent?consentmode=basic
      // Region specific behavior
      // https://developers.google.com/tag-platform/security/guides/consent?consentmode=advanced#region-specific-behavior

      gtag('consent', 'default', {
        analytics_storage: 'granted',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
      });
      // deny everything by default for EU countries
      gtag('consent', 'default', {
        analytics_storage: 'denied',
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        region: window.euCountryList
      });

      gtag('js', new Date());
      gtag('config', window.gtagMeasurementId);
    }
  </script>
  <!-- loading gtag.js and in src/privacy/useGtagConsent.ts -->

  <!-- Declared here once for the whole app rather than in MainComponent's stylesheet, since
       component stylesheets are unscoped and this avoids re-declaring it if that content ever
       splits across files. Served as woff2 - 17kB, against 55kB as TrueType - with the .ttf
       original kept as a fallback src. Not preloaded: fetching it up front only pushes the app
       bundle back, and `font-display: swap` keeps text readable in a fallback face until it lands. -->
  <style>@font-face{font-family:Highway Gothic Narrow;src:url(./fonts/HighwayGothicNarrow.woff2)format("woff2"),url(./fonts/HighwayGothicNarrow.ttf)format("truetype");font-display:swap}</style>
